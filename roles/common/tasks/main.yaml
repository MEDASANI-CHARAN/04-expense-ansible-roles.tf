- name: Download the artifact from nexus
  tags:
  - deployment
  ansible.builtin.get_url:
    url: "http://{{nexus_url}}:8081/repository/{{component}}/com/expense/{{component}}/{{appVersion}}/{{component}}-{{appVersion}}.zip"
    dest: /tmp/backend.zip
